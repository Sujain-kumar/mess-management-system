<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Portal | Join Us</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff4d88;
            --accent: #7000ff;
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Same premium background for consistency */
            background: radial-gradient(circle at center, rgba(0,0,0,0.4), rgba(0,0,0,0.8)), 
                        url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070") center/cover;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Floating 3D Elements */
        .food-icon {
            position: absolute;
            font-size: 2.5rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: float 8s infinite ease-in-out;
            z-index: 1;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(-15deg); }
        }

        /* Glass Card */
        .register-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px;
            border-radius: 30px;
            width: 420px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 10;
        }

        .inner-content {
            transform: translateZ(60px); /* Creates the 3D pop effect */
        }

        .title {
            color: white;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            padding: 12px 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 77, 136, 0.3);
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .reg-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 12px;
            color: white;
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(255, 77, 136, 0.3);
            transition: all 0.3s;
        }

        .reg-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .back-link {
            display: block;
            text-align: center;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 15px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: white;
        }

    </style>
</head>

<body>

    <div class="food-icon" style="top: 10%; right: 20%;">🍎</div>
    <div class="food-icon" style="bottom: 20%; left: 15%;">🍔</div>
    <div class="food-icon" style="top: 40%; left: 5%;">🍦</div>

    <div class="register-card" id="card">
        <div class="inner-content">
            <h2 class="title">Join the Mess</h2>
            
            <input id="name" class="form-control" placeholder="Full Name">
            <input id="email" type="email" class="form-control" placeholder="Email Address">
            <input id="password" type="password" class="form-control" placeholder="Create Password">

            <button class="btn reg-btn w-100" onclick="register()">Create Account</button>

            <a href="#" class="back-link" onclick="window.location='login.html'">
                Already have an account? Sign In
            </a>
        </div>
    </div>

    <script>
        /* 3D Tilt Logic */
        const card = document.getElementById("card");

        document.addEventListener("mousemove", (e) => {
            let x = (window.innerWidth / 2 - e.pageX) / 25;
            let y = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        /* Registration Logic (API remains identical) */
        function register() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if(!name || !email || !password) {
                alert("Please fill in all fields");
                return;
            }

            fetch("http://localhost:5000/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    role: "student"
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                window.location = "login.html";
            })
            .catch(err => {
                console.error("Registration error:", err);
                alert("Server connection failed.");
            });
        }
    </script>

</body>
</html>

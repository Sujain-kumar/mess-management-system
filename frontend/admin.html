<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Management Vault</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --dark-vault: #0f1115;
            --accent-red: #e63946;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1c1f26 0%, #000000 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            overflow: hidden;
            perspective: 2000px;
        }

        /* Molten Gold Drip */
        .gold-drip {
            position: fixed;
            top: -10px;
            left: 0;
            width: 100%;
            height: 200px;
            background-image: url('https://www.transparentpng.com/download/pink-drip/pink-liquid-dripping-png-3.png');
            background-repeat: repeat-x;
            background-size: contain;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)) sepia(1) saturate(5) hue-rotate(5deg);
            z-index: 100;
            pointer-events: none;
        }

        /* 3D Command Stage */
        .stage {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-card {
            background: linear-gradient(145deg, rgba(30,33,39,0.9), rgba(10,11,14,0.95));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 60px;
            width: 950px;
            padding: 80px 40px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 60px 120px rgba(0,0,0,0.8), inset 0 0 40px rgba(212, 175, 55, 0.05);
            transition: transform 0.1s ease-out;
        }

        /* 3D Floating Chef Hat & Assets */
        .floating-asset {
            position: absolute;
            z-index: 150;
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6));
            pointer-events: none;
        }

        .title-area {
            transform: translateZ(100px);
            margin-bottom: 60px;
            text-align: center;
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: 12px;
            background: linear-gradient(to right, #fff, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Hexagonal / Diamond Grid Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            transform: translateZ(60px);
        }

        .admin-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 25px;
            padding: 40px 15px;
            color: white;
            text-decoration: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .admin-btn:hover {
            background: linear-gradient(135deg, var(--gold), #b38f2d);
            border-color: var(--gold);
            transform: translateZ(40px) translateY(-15px) rotateY(10deg);
            color: black;
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.3);
        }

        .icon-box {
            font-size: 2.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.2));
        }

        .logout-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateZ(30px);
            color: rgba(255,255,255,0.3);
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 30px;
            border-radius: 50px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .logout-btn:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
            background: rgba(230, 57, 70, 0.05);
        }

    </style>
</head>
<body>

    <div class="gold-drip"></div>

    <img src="https://pngimg.com/d/chef_hat_PNG32.png" 
         class="floating-asset" id="asset-1" style="width: 250px; top: -80px; left: -100px; transform: translateZ(150px) rotate(-15deg);" alt="Chef Hat">
    
    <img src="https://pngimg.com/d/golden_cup_PNG94628.png" 
         class="floating-asset" id="asset-2" style="width: 200px; bottom: -50px; right: -80px; transform: translateZ(120px) rotate(10deg);" alt="Gold Asset">

    <div class="stage">
        <div class="admin-card" id="card">
            
            <div class="title-area">
                <p style="color: var(--gold); letter-spacing: 6px; font-weight: 800; font-size: 0.8rem;">SYSTEM OVERRIDE</p>
                <h1>ADMIN VAULT</h1>
            </div>

            <div class="menu-grid">
                <div class="admin-btn" onclick="window.location='admin_menu.html'">
                    <div class="icon-box">📜</div>
                    <span class="fw-bold">EDIT MENU</span>
                </div>
                
                <div class="admin-btn" onclick="window.location='admin_students.html'">
                    <div class="icon-box">👥</div>
                    <span class="fw-bold">STUDENTS</span>
                </div>

                <div class="admin-btn" onclick="window.location='admin_complaints.html'">
                    <div class="icon-box">💬</div>
                    <span class="fw-bold">FEEDBACK</span>
                </div>

                <div class="admin-btn" onclick="window.location='admin_attendance.html'">
                    <div class="icon-box">📅</div>
                    <span class="fw-bold">ATTENDANCE</span>
                </div>
            </div>

            <button class="logout-btn" onclick="logout()">TERMINATE SESSION</button>

        </div>
    </div>

    <script>
        const card = document.getElementById("card");
        const a1 = document.getElementById("asset-1");
        const a2 = document.getElementById("asset-2");

        document.addEventListener("mousemove", (e) => {
            let x = (window.innerWidth / 2 - e.pageX) / 35;
            let y = (window.innerHeight / 2 - e.pageY) / 35;

            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;

            // Deep parallax for the chef hat and gold cup
            a1.style.transform = `translate3d(${-x*3}px, ${-y*3}px, 150px) rotate(${-15 + x/2}deg)`;
            a2.style.transform = `translate3d(${x*2}px, ${y*2}px, 120px) rotate(${10 - x/2}deg)`;
        });

        function logout(){
            window.location = "login.html";
        }
    </script>
</body>
</html>

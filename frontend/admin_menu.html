<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Menu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
font-family:Arial;
color:white;
}

.container-box{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card-ui{
background:rgba(255,255,255,0.05);
padding:50px;
border-radius:25px;
width:700px;
text-align:center;
backdrop-filter:blur(20px);
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

h2{
margin-bottom:30px;
letter-spacing:4px;
color:#00c6ff;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:10px;
border:none;
outline:none;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
margin:5px;
cursor:pointer;
font-weight:bold;
}

.update{
background:#00c6ff;
color:black;
}

.view{
background:#00ff9d;
color:black;
}

#preview{
margin-top:20px;
padding:15px;
background:rgba(255,255,255,0.1);
border-radius:10px;
min-height:120px;
}

.back{
margin-top:20px;
background:#ff4d6d;
color:white;
}

</style>

</head>

<body>

<div class="container-box">

<div class="card-ui">

<h2>🍽 MENU MANAGER</h2>

<input id="day" placeholder="Enter Day (Monday, Tuesday...)">
<input id="breakfast" placeholder="Breakfast">
<input id="lunch" placeholder="Lunch">
<input id="dinner" placeholder="Dinner">

<button class="update" onclick="updateMenu()">Update Menu</button>
<button class="view" onclick="loadMenu()">View Menu</button>

<div id="preview">Menu preview will appear here...</div>

<button class="back" onclick="window.location='admin.html'">Back</button>

</div>

</div>

<script>

function loadMenu(){

let day = document.getElementById("day").value

if(!day){
alert("Enter day first")
return
}

fetch("http://localhost:5000/menu_all")
.then(res=>res.json())
.then(data=>{

let found = data.find(m => m.day.toLowerCase() === day.toLowerCase())

if(!found){
document.getElementById("preview").innerHTML = "❌ No menu found"
return
}

document.getElementById("preview").innerHTML = `
📅 ${found.day}<br><br>
🥞 Breakfast: ${found.breakfast}<br>
🍛 Lunch: ${found.lunch}<br>
🍲 Dinner: ${found.dinner}
`

})

}


function updateMenu(){

let day = document.getElementById("day").value

if(!day){
alert("Enter day")
return
}

fetch("http://localhost:5000/menu/"+day,{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
breakfast:document.getElementById("breakfast").value,
lunch:document.getElementById("lunch").value,
dinner:document.getElementById("dinner").value
})
})
.then(res=>res.json())
.then(data=>{
alert(data.message)
loadMenu() // 🔥 auto refresh preview
})

}

</script>

</body>
</html>

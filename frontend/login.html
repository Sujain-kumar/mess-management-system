<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Portal | Premium Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff4d88;
            --accent: #7000ff;
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* High-end culinary background */
            background: radial-gradient(circle at center, rgba(0,0,0,0.4), rgba(0,0,0,0.8)), 
                        url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070") center/cover;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Floating 3D Elements */
        .food-icon {
            position: absolute;
            font-size: 2.5rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation: float 8s infinite ease-in-out;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(20deg); }
        }

        /* Main Glass Card */
        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 30px;
            width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            z-index: 10;
            position: relative;
        }

        /* Content inside card for 3D depth */
        .inner-content {
            transform: translateZ(50px);
        }

        .title {
            color: white;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 30px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: white;
            padding: 12px 20px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 77, 136, 0.3);
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 15px;
            color: white;
            padding: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(255, 77, 136, 0.3);
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px rgba(255, 77, 136, 0.5);
            filter: brightness(1.1);
        }

        .signup-btn {
            border: 1px solid var(--border);
            color: white;
            border-radius: 15px;
            background: transparent;
            transition: all 0.3s;
        }

        .signup-btn:hover {
            background: white;
            color: black;
        }

    </style>
</head>

<body>

    <div class="food-icon" style="top: 15%; left: 15%; animation-delay: 0s;">🍱</div>
    <div class="food-icon" style="top: 70%; left: 10%; animation-delay: 2s;">🍕</div>
    <div class="food-icon" style="top: 20%; right: 15%; animation-delay: 4s;">🥗</div>
    <div class="food-icon" style="bottom: 15%; right: 10%; animation-delay: 1s;">🍰</div>

    <div class="login-card" id="card">
        <div class="inner-content">
            <h2 class="title text-center">MESS PORTAL</h2>
            
            <div class="mb-4">
                <input id="email" type="email" class="form-control" placeholder="Email Address">
            </div>

            <div class="mb-4">
                <input id="password" type="password" class="form-control" placeholder="Password">
            </div>

            <button class="btn login-btn w-100 mb-3" onclick="login()">Sign In</button>
            
            <div class="text-center">
                <button class="btn signup-btn w-100" onclick="window.location='signup.html'">
                    Create Account
                </button>
            </div>
        </div>
    </div>

    <script>
        /* 3D Tilt Effect Logic (Exactly as requested) */
        const card = document.getElementById("card");

        document.addEventListener("mousemove", (e) => {
            let x = (window.innerWidth / 2 - e.pageX) / 25; // Smoother factor
            let y = (window.innerHeight / 2 - e.pageY) / 25;

            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        /* API Logic (Exactly as requested) */
        function login() {
            fetch("http://localhost:5000/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                localStorage.setItem("user", data.name);

                if (data.role == "admin") {
                    window.location = "admin.html";
                }
                if (data.role == "student") {
                    window.location = "student.html";
                }
            })
            .catch(err => {
                console.error("Login Error:", err);
                alert("Connection error. Is the server running?");
            });
        }
    </script>

</body>
</html>
